name: Build Windows x64

# 云编译工作流：push / 打 tag / 手动触发时，
# 在 GitHub 自带的 Windows runner 上用 MSYS2 交叉编译 IMSProg 三个程序，
# 自动部署 Qt 运行时 + 插件 + 数据库 + 驱动，打包 IMSProg_win-amd64.zip。
# 打 v* tag 时还会自动创建/更新 Release 并上传 zip。

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-qt6-svg
            mingw-w64-x86_64-libftdi1
            mingw-w64-x86_64-libusb
            mingw-w64-x86_64-pkgconf
            p7zip

      - name: Configure
        run: |
          cmake -S . -B build -G "MSYS Makefiles" -DCMAKE_BUILD_TYPE=RELEASE \
            -DCMAKE_C_FLAGS_RELEASE="-O3 -DNDEBUG -static" \
            -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG -static"

      - name: Build
        run: |
          cmake --build build --parallel 4

      - name: Package
        run: |
          bash .github/scripts/package-win.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IMSProg_win-amd64
          path: dist/IMSProg_win-amd64.zip

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/IMSProg_win-amd64.zip
