name: Build Windows x64

# 云编译工作流：push / 打 tag / 手动触发时，
# 在 GitHub 自带的 Windows runner 上用 MSYS2 交叉编译 IMSProg 三个程序，
# 自动部署 Qt 运行时 + 插件 + 数据库 + 驱动，打包 IMSProg_win-amd64.zip。
# 打 v* tag 时还会自动创建/更新 Release 并上传 zip。

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-qt6-imageformats
            mingw-w64-ucrt-x86_64-libjpeg-turbo
            mingw-w64-ucrt-x86_64-libtiff
            mingw-w64-ucrt-x86_64-libwebp
            mingw-w64-ucrt-x86_64-libmng
            mingw-w64-ucrt-x86_64-jasper
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-libftdi
            mingw-w64-ucrt-x86_64-libusb
            pkgconf
            p7zip

      - name: Configure
        run: |
          echo "PATH=$PATH"
          command -v cmake gcc g++ ninja libftdi-config || true
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RELEASE \
            -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_C_FLAGS_RELEASE="-O3 -DNDEBUG -static" \
            -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG -static"

      - name: Build
        run: |
          cmake --build build

      - name: Package
        run: |
          bash .github/scripts/package-win.sh

      - name: Upload artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: IMSProg_win-amd64
          path: dist/IMSProg_win-amd64.zip

      - name: Rename release asset
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mv dist/IMSProg_win-amd64.zip "dist/${GITHUB_REF_NAME}-windows.zip"

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/${{ github.ref_name }}-windows.zip
